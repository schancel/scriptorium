name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm install --no-audit --no-fund
      - name: Build
        run: make build
      # Stage only what the site needs. Uploading '.' would ship node_modules
      # and the whole git-tracked repo, which is slow and hits artifact limits.
      #
      # Everything goes under v/<sha>/ and index.html is rewritten to point
      # there. GitHub Pages serves max-age=600, so without this a visitor who
      # loaded the site in the last ten minutes gets stale modules after a
      # deploy -- and cannot tell a cached copy from a broken one. Versioning
      # the directory changes every URL when the commit changes, so a deploy
      # is never served half-old. main.js resolves data relative to its own
      # URL, so data must live inside the versioned tree too.
      - name: Stage site
        run: |
          test -f index.html || { echo "no index.html yet -- nothing to deploy"; exit 1; }
          SHA="${GITHUB_SHA:0:12}"
          # ONE path segment, not two. main.js resolves data with a fixed
          # `../../../`, which from build/platform/web/ landed on the site root.
          # A two-segment v/<sha>/ pushed that one level too shallow, so every
          # data fetch 404'd into a fallback -- silently, because the loaders
          # have defaults. Keep the depth identical to `build/`.
          mkdir -p "_site/v-$SHA"
          cp -r build/* "_site/v-$SHA/"
          cp -r data _site/data
          sed "s|\./build/|./v-$SHA/|g" index.html > _site/index.html
          touch _site/.nojekyll
          grep -o 'src="[^"]*"' _site/index.html
          du -sh _site

      # Resolve the data URL the way main.js does, from the script src in the
      # served index -- not from a path we happen to believe in. The versioned
      # deploy broke exactly this and every asset I spot-checked by hand was
      # fine, because I checked paths I chose rather than paths the app asks for.
      - name: Check the app's own data path resolves
        run: |
          SRC=$(grep -o 'src="[^"]*main\.js"' _site/index.html | sed 's/src="//;s/"//')
          DIR=$(dirname "${SRC#./}")
          RESOLVED=$(cd "_site/$DIR" && cd ../../.. && pwd)
          for f in data/themes.json data/tuning.json data/curriculum.json data/texts/web/genesis.json; do
            test -f "$RESOLVED/$f" || { echo "main.js would 404 on $f (resolved from $DIR)"; exit 1; }
          done
          echo "all data files resolve from $DIR via ../../../" 
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: '_site' }
      - id: deployment
        uses: actions/deploy-pages@v4
